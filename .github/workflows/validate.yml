name: Validate OpenEnv Submission

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Lint with basic checks
      run: |
        python -m py_compile smart_traffic_signal/*.py
        python -m py_compile tests/*.py
        python -m py_compile server.py inference.py
    
    - name: Run pytest
      run: |
        pytest -v --tb=short
    
    - name: Test environment import
      run: |
        python -c "from smart_traffic_signal import SmartAdaptiveTrafficSignalEnv; env = SmartAdaptiveTrafficSignalEnv('easy'); obs = env.reset(); print('Environment import OK')"

  docker:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: false
        tags: smart-traffic-signal:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

  openenv:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install openenv-core
    
    - name: Validate openenv.yaml
      run: |
        openenv validate
